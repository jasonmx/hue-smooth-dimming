raise:
  name: Raise
  description: Start raising the brightness.
  target:
    entity:
      domain: light
      integration: hue
  fields:
    sweep_time:
      name: Sweep
      description: Duration of 0-100% sweep.
      example: 5
      required: false
      selector:
        number:
          min: 0.1
          step: any
          unit_of_measurement: s
          mode: box
    limit:
      name: Maximum brightness limit
      description: Stop transition at limit.
      example: 100
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 0.2
          unit_of_measurement: "%"

lower:
  name: Lower
  description: Start lowering the brightness.
  target:
    entity:
      domain: light
      integration: hue
  fields:
    sweep_time:
      name: Sweep
      description: Duration of 100-0% sweep.
      example: 5
      required: false
      selector:
        number:
          min: 0.1
          step: any
          unit_of_measurement: s
          mode: box
    limit:
      name: Minimum brightness limit
      description: Light turns off at 0%. Choose 0.4%+ to keep light on.
      example: 0.4
      required: false
      selector:
        number:
          min: 0
          max: 99
          step: 0.2
          unit_of_measurement: "%"

stop:
  name: Stop
  description: Stop a brightness transition.
  target:
    entity:
      domain: light
      integration: hue

set_attributes:
  name: Set attributes
  description: Set brightness, color temp, or color without changing on/off state.
  target:
    entity:
      domain: light
      integration: hue
  fields:
    brightness:
      name: Brightness
      description: Brightness level (%)
      example: 50
      required: false
      selector:
        number:
          min: 0.4
          max: 100
          step: 0.2
          unit_of_measurement: "%"
    min_brightness:
      name: Minimum brightness
      description: Enforce a minimum brightness (%)
      example: 20
      required: false
      selector:
        number:
          min: 0.4
          max: 100
          step: 0.2
          unit_of_measurement: "%"
    max_brightness:
      name: Maximum brightness
      description: Enforce a maximum brightness (%)
      example: 80
      required: false
      selector:
        number:
          min: 0.4
          max: 100
          step: 0.2
          unit_of_measurement: "%"
    color_temp_kelvin:
      name: Color temperature
      description: Color temperature (K)
      example: 2800
      required: false
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.COLOR_TEMP
      selector:
        number:
          min: 2200
          max: 6535
          step: 10
          unit_of_measurement: K
    rgb_color:
      name: RGB color
      description: "Color as [red, green, blue] (0–255 each)"
      example: "[255, 100, 100]"
      required: false
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.RGB
      selector:
        color_rgb:
    hs_color:
      name: Hue/Sat color
      description: "Color as [hue, saturation] (0–360, 0–100)"
      example: "[300, 70]"
      required: false
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.HS
      selector:
        object:
    xy_color:
      name: XY color
      description: "Color as [x, y]"
      example: "[0.52, 0.43]"
      required: false
      filter:
        attribute:
          supported_color_modes:
            - light.ColorMode.XY
      selector:
        object:

get_attributes:
  name: Get attributes
  description: Get brightness, color temp, and color (RGB, HS, XY), even if lights are off. Returns one record per target.
  target:
    entity:
      domain: light
      integration: hue

set_scene:
  name: Set scene
  description: Set a Hue scene without turning on its lights.
  target:
    entity:
      domain: scene
      integration: hue
